<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>실시간 점수 매기기</title>
<style>
:root{
  --bg:#f6f7f9; --panel:#fff; --panel2:#f0f2f5; --line:#dfe3e8;
  --fg:#16181d; --muted:#636b78; --accent:#3f5efb; --accent-fg:#fff;
  --ok:#1a9c5b; --warn:#c27803; --bad:#d64545; --chip:#e9ecf2; --radius:12px;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#14161a; --panel:#1c1f25; --panel2:#23272f; --line:#31363f;
  --fg:#e9ecf1; --muted:#98a1b0; --accent:#7b8cff; --accent-fg:#0f1115;
  --ok:#46c98a; --warn:#e0a33a; --bad:#ef7676; --chip:#2b3038;
}}
:root[data-theme="dark"]{
  --bg:#14161a; --panel:#1c1f25; --panel2:#23272f; --line:#31363f;
  --fg:#e9ecf1; --muted:#98a1b0; --accent:#7b8cff; --accent-fg:#0f1115;
  --ok:#46c98a; --warn:#e0a33a; --bad:#ef7676; --chip:#2b3038;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--fg);font-size:15px;line-height:1.55;
  font-family:"Pretendard","Apple SD Gothic Neo","Noto Sans KR",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  -webkit-text-size-adjust:100%}
.wrap{max-width:900px;margin:0 auto;padding:18px 16px 60px}
h1{font-size:20px;margin:0;letter-spacing:-.02em}
h2{font-size:17px;margin:0 0 10px}
h3{font-size:14px;margin:0 0 8px;color:var(--muted);font-weight:600}
p{margin:0 0 10px}
.muted{color:var(--muted)}.small{font-size:13px}.tiny{font-size:12px}
header.top{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:16px}
header.top .spacer{flex:1}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin-bottom:14px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.row.tight{gap:6px}
button{font:inherit;font-weight:600;border:1px solid var(--line);background:var(--panel2);color:var(--fg);
  padding:9px 14px;border-radius:10px;cursor:pointer;transition:.12s}
button:hover:not(:disabled){border-color:var(--accent)}
button:disabled{opacity:.45;cursor:not-allowed}
button.primary{background:var(--accent);color:var(--accent-fg);border-color:transparent}
button.ghost{background:transparent}
button.sm{padding:5px 10px;font-size:13px;border-radius:8px}
input[type=text],select{font:inherit;background:var(--panel2);color:var(--fg);border:1px solid var(--line);
  border-radius:9px;padding:9px 11px;width:100%}
input:focus{outline:2px solid var(--accent);outline-offset:-1px}
label.file{display:inline-flex;align-items:center;gap:8px;padding:9px 14px;border:1px dashed var(--line);
  border-radius:10px;cursor:pointer;font-weight:600;background:var(--panel2)}
label.file input{display:none}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--chip);border-radius:999px;padding:4px 11px;font-size:13px;font-weight:600}
.chip.done{background:color-mix(in srgb,var(--ok) 22%,transparent);color:var(--ok)}
.chip.wait{background:color-mix(in srgb,var(--warn) 20%,transparent);color:var(--warn)}
.dot{width:7px;height:7px;border-radius:50%;background:var(--muted);flex:none}
.dot.on{background:var(--ok)}
.code{font-family:ui-monospace,Menlo,monospace;font-size:26px;letter-spacing:.24em;font-weight:700}
.tablewrap{overflow-x:auto;-webkit-overflow-scrolling:touch;border:1px solid var(--line);border-radius:var(--radius)}
table{border-collapse:collapse;width:100%;font-size:14px;min-width:max-content}
th,td{padding:9px 12px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
th{background:var(--panel2);font-size:12.5px;color:var(--muted);font-weight:700}
tbody tr:last-child td{border-bottom:none}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
th.sortable{cursor:pointer;user-select:none}
th.sortable:hover{color:var(--accent)}
.crit{display:grid;grid-template-columns:1fr 120px auto;gap:10px;align-items:center;padding:11px 0;border-bottom:1px solid var(--line)}
.crit:last-child{border-bottom:none}
.crit .nm{font-weight:600;min-width:0;overflow-wrap:anywhere}
.crit .dsc{font-size:12.5px;color:var(--muted);font-weight:400;margin-top:2px;overflow-wrap:anywhere}
.crit .w{font-size:12px;color:var(--muted);font-weight:500}
.crit.skipped .nm,.crit.skipped input{opacity:.4}
@media (max-width:520px){.crit{grid-template-columns:1fr 96px auto;gap:8px}}
.bar{height:6px;background:var(--panel2);border-radius:999px;overflow:hidden;margin:10px 0}
.bar>i{display:block;height:100%;background:var(--accent);transition:width .25s}
.err{color:var(--bad);font-size:13px;font-weight:600;margin-bottom:10px}
.banner{background:color-mix(in srgb,var(--accent) 12%,transparent);border:1px solid color-mix(in srgb,var(--accent) 35%,transparent);
  padding:10px 12px;border-radius:10px;font-size:13.5px;margin-bottom:12px}
.banner.warn{background:color-mix(in srgb,var(--warn) 14%,transparent);border-color:color-mix(in srgb,var(--warn) 40%,transparent)}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;padding:16px;z-index:50}
.modal .box{background:var(--panel);border:1px solid var(--line);border-radius:14px;max-width:860px;width:100%;
  max-height:82vh;overflow:auto;padding:18px}
ol.steps{padding-left:18px;margin:0}
ol.steps li{margin-bottom:5px}
pre.fmt{background:var(--panel2);border:1px solid var(--line);border-radius:9px;padding:10px;font-size:12.5px;overflow-x:auto;margin:6px 0 0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:640px){.grid2{grid-template-columns:1fr}}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{border:none;border-radius:0;background:transparent}
.seg button.on{background:var(--accent);color:var(--accent-fg)}
.setupgrid,.scoregrid{display:grid;grid-template-columns:1fr 1fr;gap:14px;align-items:start}
.scoregrid{grid-template-columns:1.25fr 1fr}
@media (max-width:760px){.setupgrid,.scoregrid{grid-template-columns:1fr}}
.col{min-width:0}
.chatmsgs{height:220px;overflow-y:auto;-webkit-overflow-scrolling:touch;border:1px solid var(--line);
  border-radius:9px;padding:8px 10px;background:var(--panel2);display:flex;flex-direction:column;gap:6px;margin-bottom:8px}
.chatmsg{font-size:13.5px;line-height:1.4;overflow-wrap:anywhere}
.chatmsg .cn{font-weight:700;margin-right:6px}
.chatmsg .cn.me{color:var(--warn)}
.chatmsg .ct{color:var(--fg)}
.chatinput{font:inherit}
.statuslist{display:flex;flex-direction:column;gap:6px}
.statusrow{display:flex;justify-content:space-between;align-items:center;padding:7px 11px;
  border:1px solid var(--line);border-radius:8px;font-size:13.5px}
.statusrow.done{border-color:color-mix(in srgb,var(--ok) 45%,var(--line))}
.statusrow .ok{color:var(--ok);font-weight:700;font-size:12.5px}
.statusrow .muted{font-size:12.5px}

/* ── 등급 발표 연출 ── */
.gradeOverlay{position:fixed;inset:0;background:rgba(10,10,16,.82);z-index:9999;
  display:flex;flex-direction:column;align-items:center;padding:56px 16px 40px;overflow-y:auto}
.gradeStage-title{color:#fff;text-align:center;margin-bottom:14px}
.gradeStage-title h2{margin:0;font-size:22px}
.gradeStage{width:100%;max-width:640px;display:flex;flex-direction:column;gap:14px;align-items:center}
.gradeStage.single{position:relative;min-height:480px;display:flex;align-items:center;justify-content:center}
.gradeStage.single .gradeCardWrap{position:absolute}
.gradeTopControls{position:fixed;top:16px;right:16px;z-index:10000;display:flex;gap:8px}
.gradeTopControls button{background:rgba(255,255,255,.15)!important;color:#fff!important;
  border-color:rgba(255,255,255,.4)!important}
.gradeClose{margin:22px auto 0;display:block}
.gradeProgress{width:100%;max-width:480px;height:5px;border-radius:999px;background:rgba(255,255,255,.18);
  overflow:hidden;margin-bottom:10px}
.gradeProgressBar{height:100%;background:#fff;border-radius:999px;transition:width .25s ease}
.gradeCount{color:#fff;opacity:.75;font-size:12.5px;margin-bottom:14px}
.gradeManualWait{margin-top:20px;text-align:center}
.gradeWaitMsg{color:#fff;opacity:.75;font-size:13px;margin:0}
.gradeNextBtn{min-width:160px}

/* 세로로 긴 전형적인 카드 모양 + 3D 뒤집기(뒷면→앞면) */
.gradeCardWrap{width:322px;max-width:94vw;aspect-ratio:5/7;perspective:1200px;
  animation:gradeCardIn .63s cubic-bezier(.2,.9,.3,1.25) both}
@keyframes gradeCardIn{
  0%{opacity:0;transform:translateY(20px) scale(.92);}
  100%{opacity:1;transform:translateY(0) scale(1);}
}
@keyframes gradeCardOut{
  0%{opacity:1;transform:scale(1) translateY(0);}
  100%{opacity:0;transform:scale(.9) translateY(-16px);}
}
.gradeCardWrap.leaving{animation:gradeCardOut .6s ease forwards!important}
.gradeCardInner{position:relative;width:100%;height:100%;transform-style:preserve-3d;
  transition:transform 1.3s cubic-bezier(.3,.15,.15,1)}
.gradeCardInner.flipped{transform:rotateY(180deg)}
.gradeFace{position:absolute;inset:0;backface-visibility:hidden;border-radius:16px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;
  padding:20px 14px;box-shadow:0 10px 28px rgba(0,0,0,.4);overflow-y:auto}
.gradeFace.back{background:linear-gradient(150deg,#30333c,#1a1c22);color:#fff}
.gradeFace.back .backmark{font-size:44px;opacity:.45}
.gradeFace.front{background:#fff;color:#1c1e24;transform:rotateY(180deg);
  border:4px solid var(--tier-color,#ccc);animation:gradeGlow 2s ease-in-out infinite}
.gradeFace .gbadge{display:inline-block;border-radius:999px;
  padding:3px 12px;font-size:13px;font-weight:800;letter-spacing:.02em;margin-bottom:10px}
.gradeFace.front .gbadge{color:var(--tier-color,#333);background:rgba(0,0,0,.06);
  animation:textGlow 2s ease-in-out infinite}
.gradeFace h3{margin:0 0 6px;font-size:19px;overflow-wrap:anywhere}
.gradeFace .gcut{font-size:15px;opacity:.85;font-weight:600}
.gperlist{margin-top:10px;width:100%;display:flex;flex-direction:column;gap:2px;font-size:11.5px}
.gperitem{display:flex;justify-content:space-between;gap:8px;padding:3px 2px;border-top:1px solid rgba(0,0,0,.08)}
.gperitem:first-child{border-top:none}
.gpn{opacity:.62;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:62%}
.gpv{font-weight:700;font-variant-numeric:tabular-nums}
@keyframes gradeShine{ 0%{background-position:-160% 0;} 100%{background-position:260% 0;} }
@keyframes textGlow{
  0%,100%{ text-shadow:0 0 0 transparent; }
  50%{ text-shadow:0 0 9px var(--glow-color,rgba(0,0,0,0)),0 0 3px var(--glow-color,rgba(0,0,0,0)); }
}
@keyframes gradeGlow{
  0%,100%{box-shadow:0 10px 28px rgba(0,0,0,.4),0 0 0 0 rgba(255,255,255,0);}
  50%{box-shadow:0 10px 28px rgba(0,0,0,.4),0 0 26px 6px var(--glow-color,rgba(255,255,255,.5));}
}
@keyframes rainbowShift{ 0%{background-position:0% 50%;} 100%{background-position:200% 50%;} }
@keyframes confettiFall{
  0%{transform:translateY(-16px) rotate(0deg);opacity:1;}
  100%{transform:translateY(340px) rotate(420deg);opacity:0;}
}
/* 송급: 회색 테두리 글로우 */
.gradeFace.front.tier-song{--tier-color:#8991a0;--glow-color:rgba(137,145,160,.55)}
/* 완급: 연두색 */
.gradeFace.front.tier-wan{--tier-color:#8bc34a;--glow-color:rgba(139,195,74,.6)}
/* 박급: 하늘색 */
.gradeFace.front.tier-bak{--tier-color:#40b4e6;--glow-color:rgba(64,180,230,.6)}
/* 배급: 보라색 */
.gradeFace.front.tier-bae{--tier-color:#9256d9;--glow-color:rgba(146,86,217,.6)}
/* 범급: 은색(테두리 위 샤인 스윕) */
.gradeFace.front.tier-beom{--tier-color:#c3c8d1;--glow-color:rgba(211,216,224,.85)}
/* 도급: 금색(테두리 위 샤인 스윕) */
.gradeFace.front.tier-do{--tier-color:#e0b32a;--glow-color:rgba(224,179,42,.8)}
.gradeFace.front.tier-beom::after, .gradeFace.front.tier-do::after{
  content:"";position:absolute;inset:0;border-radius:12px;pointer-events:none;
  background:linear-gradient(115deg,transparent 40%,rgba(255,255,255,.75) 50%,transparent 60%);
  background-size:250% 100%;animation:gradeShine 2.2s linear infinite}
/* 양급: 무지개 테두리(그라데이션 보더) */
.gradeFace.front.tier-yang{
  --glow-color:rgba(255,255,255,.85);
  --tier-color:#ff5ea8;
  border:4px solid transparent;
  background-image:linear-gradient(#fff,#fff),linear-gradient(90deg,#ff5ea8,#ffb347,#fff066,#6bffb8,#5ec8ff,#a26bff,#ff5ea8);
  background-origin:border-box; background-clip:padding-box,border-box;
  background-size:100% 100%,300% 100%;
  animation:gradeGlow 1.6s ease-in-out infinite,rainbowShift 3s linear infinite}
.confetti{position:absolute;top:0;width:8px;height:14px;border-radius:2px;opacity:0;
  animation:confettiFall 1.6s ease-in forwards;pointer-events:none}

/* ── 범급 미만 일괄 공개(격자) ── */
.gradeGrid{display:grid;gap:6px;flex:1;min-height:0;width:100%;max-width:1100px}
@keyframes gridCardPop{
  0%{opacity:0;transform:scale(.45);}
  70%{opacity:1;transform:scale(1.06);}
  100%{opacity:1;transform:scale(1);}
}
.gradeGridCard{position:relative;overflow:hidden;border-radius:8px;background:#fff;color:#1c1e24;
  display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;
  padding:4px 6px;min-width:0;min-height:0;opacity:0;
  animation:gridCardPop .3s cubic-bezier(.2,.9,.3,1.3) both;
  border:2px solid var(--tier-color,#ccc);box-shadow:0 0 10px 1px var(--glow-color,rgba(255,255,255,.35))}
.gradeGridCard .ggname{font-size:11px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;width:100%}
.gradeGridCard .ggscore{font-size:10px;color:#666;margin-top:2px}
.gradeGridCard.tier-song{--tier-color:#8991a0;--glow-color:rgba(137,145,160,.5)}
.gradeGridCard.tier-wan{--tier-color:#8bc34a;--glow-color:rgba(139,195,74,.55)}
.gradeGridCard.tier-bak{--tier-color:#40b4e6;--glow-color:rgba(64,180,230,.55)}
.gradeGridCard.tier-bae{--tier-color:#9256d9;--glow-color:rgba(146,86,217,.55)}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <h1>실시간 점수 매기기</h1>
    <div class="spacer"></div>
    <div id="hdr" class="small muted"></div>
  </header>
  <div id="app"><div class="card muted">불러오는 중…</div></div>
</div>

<script type="module">
/* ═══════════════════════════════════════════════════════════════
   ① 여기에 Firebase 콘솔에서 받은 설정을 붙여넣으세요.
      (프로젝트 설정 → 내 앱 → 웹 앱 → firebaseConfig)
      databaseURL 이 반드시 포함되어야 합니다. (Realtime Database)
   ═══════════════════════════════════════════════════════════════ */
const firebaseConfig = {
  apiKey: "AIzaSyBB01W7QxrRrtE-YChYuSGVdtma0AU2Vxk",
  authDomain: "rankingprogram-81.firebaseapp.com",
  databaseURL: "https://rankingprogram-81-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "rankingprogram-81",
  storageBucket: "rankingprogram-81.firebasestorage.app",
  messagingSenderId: "443153135278",
  appId: "1:443153135278:web:e07fcec300780f7cf09f3f"
};
/* ═══════════════════════════════════════════════════════════════ */

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js";
import { getDatabase, ref, onValue, set, update, get, remove, onDisconnect, runTransaction, serverTimestamp, push, query, limitToLast }
  from "https://www.gstatic.com/firebasejs/10.12.5/firebase-database.js";

const $ = s => document.querySelector(s);
const APP = $("#app"), HDR = $("#hdr");
const esc = s => String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const rid = p => p+Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-4);
const num = (x,d) => (Math.round(x*Math.pow(10,d))/Math.pow(10,d)).toFixed(d);
function ls(k,v){try{if(v===undefined)return localStorage.getItem(k);if(v===null)localStorage.removeItem(k);else localStorage.setItem(k,v);}catch(e){return null;}return v;}
/* Firebase 는 배열/객체를 상황에 따라 다르게 돌려주므로 항상 객체처럼 다룹니다 */
const obj = o => (o && typeof o === "object") ? o : {};
const arr = o => Array.isArray(o) ? o.filter(x=>x!=null) : Object.values(obj(o));

/* ───────── state ───────── */
const S = {
  ready:false, configured:false, db:null,
  viewerId: ls("sc.viewer") || ls("sc.viewer", rid("v_")),
  name: ls("sc.name") || "",
  peerId: rid("p_"),
  code:null, memberId:null, room:null, presence:{}, chat:{},
  unsub:[], screen:"lobby",
  draft:null, draftFor:null, skip:{}, draftVal:{},
  pending:null, err:"", banner:"", modal:null, lastSig:"",
  single:null, resultSort:{key:null,dir:"desc"}, resultSearch:""
};

/* ───────── boot ───────── */
try{
  if(!firebaseConfig.databaseURL) throw new Error("no config");
  const app = initializeApp(firebaseConfig);
  S.db = getDatabase(app);
  S.configured = true;
}catch(e){ S.configured = false; }
S.ready = true;
render(true);
APP.addEventListener("click",ev=>{
  const b=ev.target.closest("[data-act]");
  if(!b) return;
  if(b.dataset.act==="closemodal"&&ev.target!==b&&ev.target.closest("[data-stop]")&&!ev.target.dataset.act) return;
  ev.stopPropagation();
  handle(b.dataset.act,b.dataset);
});

/* ───────── db helpers ───────── */
const R  = p => ref(S.db, p);
const Proom = c => "rooms/"+c;

function detach(){ S.unsub.forEach(u=>{try{u();}catch(e){}}); S.unsub=[]; }
function attach(code){
  detach();
  let firstSnap=true;
  S.unsub.push(onValue(R(Proom(code)), snap=>{
    const prevRevealed = S.room ? !!S.room.gradesRevealed : false;
    S.room = snap.val();
    if(!S.room){ S.banner="방이 사라졌습니다."; leaveLocal(); render(true); return; }
    S.room.targets = arr(S.room.targets);
    S.room.criteria = arr(S.room.criteria);
    if(S.memberId && S.screen==="room" && !obj(S.room.members)[S.memberId]){
      ls("sc.member."+code,null);
      S.banner="방장에 의해 강퇴되었습니다.";
      leaveLocal(); render(true); return;
    }
    const nowRevealed=!!S.room.gradesRevealed;
    if(!firstSnap && !prevRevealed && nowRevealed && S.room.phase==="results"){
      playGradeReveal(computeGrades(), {sync:true, bulkLowTiers:!!S.room.gradeBulkLowTiers});
    }
    firstSnap=false;
    hostTick(); render();
  }, err=>{ S.err="연결 오류: "+err.message; render(true); }));
  /* 접속 표시 */
  const pref = R(Proom(code)+"/presence/"+S.peerId);
  onDisconnect(pref).remove();
  set(pref, { memberId:S.memberId, at:serverTimestamp() }).catch(()=>{});
  /* 채팅 (최근 200개) */
  S.unsub.push(onValue(query(R(Proom(code)+"/chat"), limitToLast(200)), snap=>{
    S.chat = obj(snap.val());
    refreshChat();
  }));
}

/* ───────── model ───────── */
const members = () => obj(S.room && S.room.members);
const scoresOf = () => obj(S.room && S.room.scores);
const memberList = () => Object.keys(members()).map(id=>Object.assign({id}, members()[id]));
const activeMembers = () => memberList().filter(m=>m.ownerId);
const me = () => members()[S.memberId] || null;
const isHost = () => !!(S.room && S.room.hostMemberId===S.memberId);
function allScorerIds(){
  const ids = Object.keys(members());
  Object.keys(scoresOf()).forEach(id=>{ if(ids.indexOf(id)<0) ids.push(id); });
  return ids;
}
function nameOf(id){
  const m=members()[id]; if(m) return m.name||"이름없음";
  const s=scoresOf()[id]; return (s&&s.name)||"이전 멤버";
}
function myCursor(){
  if(!S.room) return 0;
  const T=S.room.targets.length;
  if(S.room.mode==="solo"){ const m=me(); return Math.min(Math.max(0,(m&&m.cursor)||0),Math.max(0,T-1)); }
  return Math.min(Math.max(0,S.room.cursor||0),Math.max(0,T-1));
}
const myScore = () => scoresOf()[S.memberId] || {v:{},done:{}};
function isDone(mid,ti){ const s=scoresOf()[mid]; return !!(s && obj(s.done)[ti]); }
function doneCount(mid){ const s=scoresOf()[mid]; if(!s) return 0; const d=obj(s.done); return Object.keys(d).filter(k=>d[k]).length; }
function allFinished(){
  if(!S.room) return false;
  const T=S.room.targets.length, act=activeMembers();
  return !!T && act.length>0 && act.every(m=>doneCount(m.id)>=T);
}

/* ───────── 점수 계산 ─────────
   각 항목은 0~100 으로 입력받고, 항목 배점(max)에 비례해 환산됩니다.
   항목 환산점 = 평균/100 × 항목 배점
   총점 = (환산점 합 / 집계된 항목 배점 합) × 만점
   → 아무도 점수를 주지 않은(전원 스킵) 항목은 배점 합에서도 빠집니다.
   trim=true면 항목마다 최고점 1개·최저점 1개를 뺀 나머지로 평균 (채점자가 3명 이상인 항목에만 적용).
   (실시간 방/싱글 모드 취합 양쪽에서 공용으로 사용) */
function aggregateFrom(targets, criteria, maxTotal, scoresObj, ids, trim){
  const full = Number(maxTotal)||100;
  return targets.map((tname,ti)=>{
    const per = criteria.map((c,ci)=>{
      const vals=[];
      ids.forEach(mid=>{
        const sc=scoresObj[mid];
        if(!sc || !obj(sc.done)[ti]) return;
        const row=obj(obj(sc.v)[ti]);
        const v=row[ci];
        if(typeof v==="number" && isFinite(v)) vals.push(v);
      });
      if(!vals.length) return {avg:null,pts:null,n:0};
      let used=vals;
      if(trim && vals.length>=3){
        const sorted=vals.slice().sort((a,b)=>a-b);
        used=sorted.slice(1,-1);
      }
      const avg=used.reduce((a,b)=>a+b,0)/used.length;
      return { avg:avg, pts: avg/100*(Number(c.max)||0), n:vals.length };
    });
    let earned=0, maxSum=0;
    per.forEach((p,ci)=>{ if(p.pts!==null){ earned+=p.pts; maxSum+=Number(criteria[ci].max)||0; } });
    return { name:tname, per, total: maxSum>0 ? earned/maxSum*full : null };
  });
}
function aggregate(){
  return aggregateFrom(S.room.targets, S.room.criteria, S.room.maxTotal, scoresOf(), allScorerIds(), !!S.room.trim);
}

/* 임의의 targets/criteria/scoresObj/ids에 대해, 대상 ti에서 각 채점자가 매긴 개인 총점(만점 기준 환산) 목록을 반환.
   스킵한 항목은 그 채점자의 계산에서 제외하고 나머지 항목만으로 환산한다.
   (실시간 방/싱글 모드 취합 양쪽에서 공용으로 사용) */
function judgeTotalsFrom(criteria, maxTotal, scoresObj, ids, ti){
  const full=Number(maxTotal)||100;
  const totals=[];
  ids.forEach(mid=>{
    const sc=scoresObj[mid];
    if(!sc || !obj(sc.done)[ti]) return;
    const row=obj(obj(sc.v)[ti]);
    let earned=0, maxSum=0;
    criteria.forEach((c,ci)=>{
      const v=row[ci];
      if(typeof v==="number" && isFinite(v)){ earned+=v/100*(Number(c.max)||0); maxSum+=Number(c.max)||0; }
    });
    if(maxSum>0) totals.push(earned/maxSum*full);
  });
  return totals;
}
function judgeTotalsForTarget(ti){
  return judgeTotalsFrom(S.room.criteria, S.room.maxTotal, scoresOf(), allScorerIds(), ti);
}
/* 모집단 표준편차. 값이 2개 미만이면 의미가 없으므로 null. */
function stddev(arr){
  if(!arr || arr.length<2) return null;
  const n=arr.length, mean=arr.reduce((a,b)=>a+b,0)/n;
  const variance=arr.reduce((a,b)=>a+(b-mean)*(b-mean),0)/n;
  return Math.sqrt(variance);
}
/* 최고값 1개, 최저값 1개를 뺀 나머지 (3개 미만이면 그대로). */
function trimExtremes(arr){
  if(!arr || arr.length<3) return (arr||[]).slice();
  const sorted=arr.slice().sort((a,b)=>a-b);
  return sorted.slice(1,-1);
}

/* ───────── 등급 발표 ─────────
   총점 기준 내림차순으로 줄을 세운 뒤, 상위 5개는 '양급'(규격 외)으로 따로 빼고,
   나머지 인원(M명)을 대상으로 등급 경계 비율(%)에 M을 곱해 버림한 '순위 컷'으로 6등급을 나눈다.
   예: 도급 컷 = floor(M*6/100) → 순위 1~그컷 까지가 도급.
   경계 비율이 누적(0→6→21→50→79→94→100)이라 항상 1..M 전체를 빈틈없이 덮는다(안전망 코드는 혹시 몰라 추가). */
/* rows: [{ti,name,total}, ...] 형태의 순수 데이터를 받아 등급을 계산하는 순수 함수.
   실시간 방 결과(computeGrades)와 연출 테스트(임의 데이터) 양쪽에서 공용으로 사용. */
function buildGrades(rows){
  const valid=rows.filter(r=>r.total!==null && r.total!==undefined).slice().sort((a,b)=>b.total-a.total);
  const invalidCount=rows.length-valid.length;
  const N=valid.length;
  const specialCount=Math.min(5,N);
  const special=valid.slice(0,specialCount);
  const rest=valid.slice(specialCount);
  const M=rest.length;
  const tiers=[
    {name:"도급", from:0, to:6},
    {name:"범급", from:6, to:21},
    {name:"배급", from:21, to:50},
    {name:"박급", from:50, to:79},
    {name:"완급", from:79, to:94},
    {name:"송급", from:94, to:100}
  ];
  /* 등급 경계 비율(%)에 M을 곱해 버림한 '누적 순위 컷'을 등급마다 구한 뒤,
     각 순위(1..M)를 '자신의 순위가 그 컷 이하인 등급 중 가장 상위(먼저 나오는) 등급'에 배정한다.
     즉 어떤 순위가 두 컷 사이(예: 도급 컷과 범급 컷 사이)에 걸쳐 어느 컷도 만족 못 시키는 경우는
     생길 수 없지만, 혹시 생기더라도 이 방식 자체가 자동으로 그 두 등급 중 더 상위 등급을 고른다
     (마지막 등급(송급)의 컷은 항상 M과 같으므로 모든 순위는 반드시 하나의 등급에 걸리게 된다). */
  const cuts=tiers.map(t=>Math.floor(M*t.to/100));
  const memberLists=tiers.map(()=>[]);
  rest.forEach((m,idx)=>{
    const rank=idx+1;
    let gi=cuts.findIndex(c=>rank<=c);
    if(gi===-1) gi=tiers.length-1; // 이론상 도달하지 않는 방어 코드
    memberLists[gi].push(m);
  });
  const cutOf=arr=>arr.length?Math.min(...arr.map(m=>m.total)):null;
  return {
    invalidCount, N, M,
    special:{ name:"양급", members:special, cut:cutOf(special) },
    groups:tiers.map((t,i)=>({ name:t.name, from:t.from, to:t.to, members:memberLists[i], cut:cutOf(memberLists[i]) }))
  };
}
function computeGrades(){
  const rows=aggregate().map((r,ti)=>({ti,name:r.name,total:r.total,per:r.per}));
  const g=buildGrades(rows);
  g.criteria=S.room.criteria;
  return g;
}
/* 연출 테스트용: 완성된(전부 채점된 것으로 취급) 임의의 데이터 n개를 만들어낸다.
   난수 4개의 평균을 쓰는 방식이라 0~100 사이에 고르게 몰리는(종형에 가까운) 점수가 나온다. */
function genTestRows(n){
  const rows=[];
  for(let i=0;i<n;i++){
    let s=0; for(let k=0;k<4;k++) s+=Math.random();
    const v=Math.max(0,Math.min(100,(s/4)*100));
    rows.push({ ti:i, name:"테스트 대상 "+(i+1), total:Math.round(v*100)/100 });
  }
  return rows;
}

/* ───────── 방장 자동 진행 ───────── */
let ticking=false;
async function hostTick(){
  if(ticking||!isHost()||!S.room) return;
  const T=S.room.targets.length;
  if(S.room.phase!=="scoring"||!T) return;
  ticking=true;
  try{
    if(S.room.mode==="sync"){
      const cur=Math.min(S.room.cursor||0,T-1);
      const maxR=typeof S.room.maxReached==="number"?S.room.maxReached:cur;
      const act=activeMembers();
      if(act.length>0 && act.every(m=>isDone(m.id,cur)) && cur===maxR){
        if(cur+1<T) await update(R(Proom(S.code)),{cursor:cur+1,maxReached:cur+1});
        else if(allFinished()) await update(R(Proom(S.code)),{phase:"results"});
      }
    }else if(allFinished()){
      await update(R(Proom(S.code)),{phase:"results"});
    }
  }catch(e){}
  ticking=false;
}

/* ───────── 파일 파싱 ───────── */
function parseTargets(text){
  let lines=text.split(/\r?\n/).map(s=>s.trim()).filter(Boolean);
  if(lines.length===1 && lines[0].indexOf(",")>-1) lines=lines[0].split(",").map(s=>s.trim()).filter(Boolean);
  return lines.map(s=>s.replace(/^[-*·]\s*/,""));
}
/* 첫 줄 = 만점(예: "200" 또는 "만점 200"), 그 다음 줄부터 = 항목 배점 (뒤에 설명을 더 적으면 선택적으로 함께 저장됨) */
function parseCriteria(text){
  const lines=text.split(/\r?\n/).map(s=>s.trim()).filter(Boolean);
  if(lines.length<2) throw new Error("첫 줄에 만점, 그 다음 줄부터 항목을 적어주세요.");
  const head=lines[0].match(/([0-9]+(?:\.[0-9]+)?)/);
  if(!head) throw new Error("첫 줄에서 만점을 찾지 못했습니다. 예: 200");
  const maxTotal=parseFloat(head[1]);
  const criteria=lines.slice(1).map(line=>{
    line=line.replace(/^[-*·]\s*/,"");
    const m=line.match(/^(.*\S)\s*[\s,:\t=|/]\s*([0-9]+(?:\.[0-9]+)?)\s*(?:점)?(?:\s*[\s,:\t=|/]\s*(.+))?$/);
    if(!m) throw new Error("‘"+line+"’ 줄에서 배점을 읽지 못했습니다. 예: 창의성 50");
    return { name:m[1].trim().replace(/[,:=|/]$/,"").trim(), max:parseFloat(m[2]), desc:(m[3]||"").trim() };
  }).filter(c=>c.name);
  if(!criteria.length) throw new Error("항목이 없습니다.");
  return { maxTotal, criteria };
}
/* 대상 + 항목을 한 파일에 담은 통합 파일 파싱.
   '[대상]' 구획과 '[항목]' 구획(대괄호는 생략 가능)이 모두 있어야 하며, 순서는 상관없음. */
function parseCombined(text){
  const lines=text.split(/\r?\n/).map(s=>s.trim());
  const isTargetHead=l=>/^\[?\s*대상\s*\]?$/.test(l);
  const isCritHead=l=>/^\[?\s*항목\s*\]?$/.test(l);
  const ti=lines.findIndex(isTargetHead), ci=lines.findIndex(isCritHead);
  if(ti<0||ci<0) throw new Error("파일에 '[대상]' 구획과 '[항목]' 구획이 모두 있어야 합니다.");
  let targetLines, criteriaLines;
  if(ti<ci){ targetLines=lines.slice(ti+1,ci); criteriaLines=lines.slice(ci+1); }
  else{ criteriaLines=lines.slice(ci+1,ti); targetLines=lines.slice(ti+1); }
  targetLines=targetLines.filter(Boolean); criteriaLines=criteriaLines.filter(Boolean);
  if(!targetLines.length) throw new Error("[대상] 구획에 대상이 없습니다.");
  const targets=parseTargets(targetLines.join("\n"));
  const parsed=parseCriteria(criteriaLines.join("\n"));
  return { targets, criteria:parsed.criteria, maxTotal:parsed.maxTotal };
}
const readFile = f => new Promise((res,rej)=>{
  const r=new FileReader();
  r.onload=()=>res(String(r.result||"")); r.onerror=()=>rej(new Error("파일을 읽지 못했습니다."));
  r.readAsText(f,"utf-8");
});
function shuffleArr(a){
  a=a.slice();
  for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; }
  return a;
}

/* ───────── 점수 입력칸 이스터에그 ─────────
   'pi'/'π' → 원주율, 'e' → 자연상수, '3pi'/'2e'처럼 앞에 숫자를 붙이면 배수.
   'shangus'(영타) 또는 그 한글 오타('노무현') → 52.3.
   입력하는 즉시(매 keystroke) 변환을 시도하며, 매치되면 입력칸 표시도 바로 기호로 바뀐다. */
function magicParse(raw){
  const t=(raw||"").trim();
  if(!t) return null;
  if(t.toLowerCase()==="shangus" || t==="노무현") return { display:"52.3", value:52.3 };
  let m=t.match(/^(\d*\.?\d*)\s*(pi|π)$/i);
  if(m){
    const coef=m[1]===""?1:parseFloat(m[1]);
    if(isFinite(coef)) return { display:(m[1]||"")+"π", value:coef*Math.PI };
  }
  m=t.match(/^(\d*\.?\d*)\s*e$/i);
  if(m && (m[1]!==""||t.toLowerCase()==="e")){
    const coef=m[1]===""?1:parseFloat(m[1]);
    if(isFinite(coef)) return { display:(m[1]||"")+"e", value:coef*Math.E };
  }
  return null;
}

/* ───────── 방 생성 / 입장 ───────── */
function leaveLocal(){ detach(); S.code=null; S.memberId=null; S.room=null; S.screen="lobby"; }

async function createRoom(seed){
  const code=String(Math.floor(1000+Math.random()*9000));
  const snap=await get(R(Proom(code)));
  if(snap.exists()) return createRoom(seed);
  const mid=rid("m_");
  const room={
    code, hostMemberId:mid, createdAt:Date.now(),
    phase:"setup", mode:(seed&&seed.mode)||"sync", order:(seed&&seed.order)||"seq", trim:!!(seed&&seed.trim),
    gradesRevealed:false,
    maxTotal:(seed&&seed.maxTotal)||100,
    targets:(seed&&seed.targets)||[], criteria:(seed&&seed.criteria)||[],
    cursor:(seed&&seed.cursor)||0, maxReached:(seed&&seed.maxReached)||0,
    resumed:!!seed,
    members:{}, scores:{}
  };
  room.members[mid]={name:S.name,ownerId:S.viewerId,cursor:0,joinedAt:Date.now()};
  if(seed){
    (seed.members||[]).forEach(m=>{ if(m&&m.id&&m.id!==mid)
      room.members[m.id]={name:m.name||"이전 멤버",ownerId:null,cursor:m.cursor||0,joinedAt:Date.now()}; });
    Object.keys(seed.scores||{}).forEach(id=>{ const s=seed.scores[id];
      room.scores[id]={name:s.name||"이전 멤버",v:obj(s.v),done:obj(s.done)}; });
  }
  await set(R(Proom(code)),room);
  S.code=code; S.memberId=mid; ls("sc.member."+code,mid); ls("sc.lastcode",code);
  S.screen="room"; attach(code); render(true);
}

async function enterRoom(code){
  code=String(code||"").trim();
  if(!/^\d{4}$/.test(code)){ S.err="4자리 방 코드를 입력하세요."; return render(true); }
  const snap=await get(R(Proom(code)));
  if(!snap.exists()){ S.err="그런 방이 없습니다."; return render(true); }
  const data=snap.val();
  const saved=ls("sc.member."+code);
  const ms=obj(data.members);
  if(saved && ms[saved] && ms[saved].ownerId===S.viewerId){
    S.code=code; S.memberId=saved; S.screen="room"; attach(code); return render(true);
  }
  if(data.phase && data.phase!=="setup"){
    S.err="투표가 진행 중이어서 새로 참여할 수 없습니다. 방장에게 문의하세요.";
    return render(true);
  }
  S.pending={ code, slots:Object.keys(ms).map(id=>Object.assign({id},ms[id])) };
  S.screen="join"; S.err=""; render(true);
}

async function claimSlot(code,mid){
  const phaseSnap=await get(R(Proom(code)+"/phase"));
  if(phaseSnap.exists() && phaseSnap.val()!=="setup"){ S.err="투표가 진행 중이어서 참여할 수 없습니다."; return render(true); }
  const mref=R(Proom(code)+"/members/"+mid);
  const res=await runTransaction(mref,cur=>{
    if(!cur) return;   // 자리 없음 → 중단
    if(cur.ownerId && cur.ownerId!==S.viewerId) return;   // abort
    cur.ownerId=S.viewerId; cur.name=S.name||cur.name||"이름없음";
    return cur;
  });
  if(!res.committed){ S.err="이미 사용 중인 자리이거나 더 이상 존재하지 않습니다."; return render(true); }
  S.code=code; S.memberId=mid; ls("sc.member."+code,mid); ls("sc.lastcode",code);
  S.pending=null; S.screen="room"; attach(code); render(true);
}

async function joinAsNew(code){
  const phaseSnap=await get(R(Proom(code)+"/phase"));
  if(phaseSnap.exists() && phaseSnap.val()!=="setup"){ S.err="투표가 진행 중이어서 참여할 수 없습니다."; return render(true); }
  const mid=rid("m_");
  const res=await runTransaction(R(Proom(code)+"/members"),cur=>{
    const m=cur||{};
    const active=Object.keys(m).filter(k=>m[k]&&m[k].ownerId).length;
    if(active>=7) return;                                  // abort
    m[mid]={name:S.name,ownerId:S.viewerId,cursor:0,joinedAt:Date.now()};
    return m;
  });
  if(!res.committed){ S.err="방이 가득 찼습니다. (동시 접속 최대 7명)"; return render(true); }
  S.code=code; S.memberId=mid; ls("sc.member."+code,mid); ls("sc.lastcode",code);
  S.pending=null; S.screen="room"; attach(code); render(true);
}

async function kickMember(mid){
  if(!isHost() || !S.room || mid===S.room.hostMemberId) return;
  try{
    await update(R(Proom(S.code)),{ ["members/"+mid]:null, ["scores/"+mid]:null });
  }catch(e){ S.err="강퇴에 실패했습니다."; render(true); }
}

async function leaveRoom(){
  try{
    if(S.code&&S.memberId) await update(R(Proom(S.code)+"/members/"+S.memberId),{ownerId:null});
    if(S.code) await remove(R(Proom(S.code)+"/presence/"+S.peerId));
  }catch(e){}
  ls("sc.member."+S.code,null);
  leaveLocal(); render(true);
}

/* ───────── 점수 입력 ───────── */
function ensureDraft(ti){
  if(S.draftFor===ti&&S.draft) return;
  const row=obj(obj(myScore().v)[ti]);
  S.draft={}; S.skip={}; S.draftVal={};
  S.room.criteria.forEach((c,ci)=>{
    const v=row[ci];
    if(v==="skip"){ S.skip[ci]=true; S.draft[ci]=""; }
    else if(typeof v==="number") S.draft[ci]=String(v);
    else S.draft[ci]="";
  });
  S.draftFor=ti;
}
async function submitTarget(){
  const ti=myCursor(), crits=S.room.criteria, vals={};
  for(let ci=0;ci<crits.length;ci++){
    if(S.skip[ci]){ vals[ci]="skip"; continue; }
    const raw=(S.draft[ci]||"").trim();
    if(raw===""){ S.err="‘"+crits[ci].name+"’ 항목의 점수를 입력하거나 스킵하세요."; return render(true); }
    const v=(S.draftVal&&S.draftVal[ci]!==undefined)?S.draftVal[ci]:Number(raw);
    if(!isFinite(v)||v<0||v>100){ S.err="‘"+crits[ci].name+"’: 0 이상 100 이하의 실수만 가능합니다."; return render(true); }
    vals[ci]=v;
  }
  S.err="";
  await update(R(Proom(S.code)+"/scores/"+S.memberId),{
    name:S.name, ["v/"+ti]:vals, ["done/"+ti]:true
  });
  if(S.room.mode==="solo"){
    const T=S.room.targets.length;
    if(ti+1<T){ await update(R(Proom(S.code)+"/members/"+S.memberId),{cursor:ti+1}); S.draftFor=null; }
    else S.banner="모든 대상의 점수 매기기를 마쳤습니다. 다른 멤버를 기다리는 중…";
  }
  render(true);
}
async function moveCursor(delta){
  const T=S.room.targets.length, ti=Math.max(0,Math.min(T-1,myCursor()+delta));
  if(S.room.mode==="solo") await update(R(Proom(S.code)+"/members/"+S.memberId),{cursor:ti});
  else{
    if(!isHost()) return;
    await update(R(Proom(S.code)),{cursor:ti,maxReached:Math.max(S.room.maxReached||0,ti)});
  }
  S.draftFor=null; S.err=""; render(true);
}

/* ───────── 싱글 모드 (오프라인: 실시간 방 없이 혼자 채점 → 결과 파일 취합) ─────────
   1) 개인 채점: 대상/항목 txt를 불러와 혼자 채점하고 결과를 json 파일로 내보냄
   2) 결과 취합: 여러 명의 결과 파일을 한 번에 불러와 자동으로 합산 */
function singleFirstUndone(){
  const T=S.single.targets.length;
  for(let i=0;i<T;i++) if(!S.single.done[i]) return i;
  return 0;
}
function singleEnsureDraft(){
  const ti=S.single.cursor;
  if(S.single.draftFor===ti) return;
  const row=obj(S.single.v[ti]);
  S.single.draft={}; S.single.skip={}; S.single.draftVal={};
  S.single.criteria.forEach((c,ci)=>{
    const v=row[ci];
    if(v==="skip"){ S.single.skip[ci]=true; S.single.draft[ci]=""; }
    else if(typeof v==="number") S.single.draft[ci]=String(v);
    else S.single.draft[ci]="";
  });
  S.single.draftFor=ti;
}
function singleSubmit(){
  const ti=S.single.cursor, crits=S.single.criteria, vals={};
  for(let ci=0;ci<crits.length;ci++){
    if(S.single.skip[ci]){ vals[ci]="skip"; continue; }
    const raw=(S.single.draft[ci]||"").trim();
    if(raw===""){ S.err="‘"+crits[ci].name+"’ 항목의 점수를 입력하거나 스킵하세요."; render(true); return; }
    const v=(S.single.draftVal&&S.single.draftVal[ci]!==undefined)?S.single.draftVal[ci]:Number(raw);
    if(!isFinite(v)||v<0||v>100){ S.err="‘"+crits[ci].name+"’: 0 이상 100 이하의 실수만 가능합니다."; render(true); return; }
    vals[ci]=v;
  }
  S.err="";
  S.single.v[ti]=vals; S.single.done[ti]=true;
  const T=S.single.targets.length;
  if(ti+1<T){ S.single.cursor=ti+1; S.single.draftFor=null; }
  else S.banner="모든 대상의 채점을 완료했습니다. 결과 파일을 내보내 취합 담당자에게 전달하세요.";
  render(true);
}
function singleMove(delta){
  const T=S.single.targets.length;
  S.single.cursor=Math.max(0,Math.min(T-1,S.single.cursor+delta));
  S.single.draftFor=null; S.err=""; render(true);
}
function buildSingleExport(){
  return {
    app:"realtime-scoring-single", version:1, savedAt:new Date().toISOString(),
    name:S.name||"이름없음", maxTotal:S.single.maxTotal,
    targets:S.single.targets, criteria:S.single.criteria,
    v:S.single.v, done:S.single.done
  };
}
function singleCombined(){
  const list=S.single.collected;
  if(!list||!list.length) return null;
  const canon=list[0];
  const scoresObj={}, ids=[];
  list.forEach(u=>{ scoresObj[u.id]={v:u.v,done:u.done}; ids.push(u.id); });
  const rows=aggregateFrom(canon.targets, canon.criteria, canon.maxTotal||100, scoresObj, ids, false)
    .map((r,ti)=>({ ...r, std: stddev(judgeTotalsFrom(canon.criteria, canon.maxTotal||100, scoresObj, ids, ti)) }));
  const mismatched=list.filter(u=>u.targets.length!==canon.targets.length||u.criteria.length!==canon.criteria.length);
  return { targets:canon.targets, criteria:canon.criteria, maxTotal:canon.maxTotal||100, rows, mismatched };
}

function onlineIds(){
  const set=new Set();
  Object.values(obj(S.room&&S.room.presence)).forEach(p=>{ if(p&&p.memberId) set.add(p.memberId); });
  return set;
}
function statusListHTML(){
  if(!S.room || S.room.phase!=="scoring") return "";
  const ti=myCursor(), act=activeMembers();
  if(!act.length) return '<div class="small muted">접속한 멤버가 없습니다.</div>';
  return '<div class="statuslist">'+act.map(m=>{
    const done=isDone(m.id,ti);
    return '<div class="statusrow'+(done?" done":"")+'"><span>'+esc(m.name||"이름없음")+(m.id===S.room.hostMemberId?" 👑":"")+'</span>'+
      '<span class="'+(done?"ok":"muted")+'">'+(done?"완료":"하는 중..")+'</span></div>';
  }).join("")+'</div>';
}
function refreshLive(){
  const b=$("#liveArea"); if(b) b.innerHTML=(S.room&&S.room.phase==="setup")?participantsHTML():liveHTML();
  const s=$("#statusArea"); if(s) s.innerHTML=statusListHTML();
}

function render(force){
  if(!S.ready){ return; }
  if(!S.configured){ APP.innerHTML=viewSetupGuide(); HDR.textContent=""; return; }
  let html="";
  if(S.screen==="lobby") html=viewLobby();
  else if(S.screen==="join") html=viewJoin();
  else if(S.screen==="singlesetup") html=viewSingleSetup();
  else if(S.screen==="singlescore") html=viewSingleScore();
  else if(S.screen==="singlecollect") html=viewSingleCollect();
  else if(!S.room) html='<div class="card muted">방 정보를 불러오는 중…</div>';
  else if(S.room.phase==="setup") html=viewSetup();
  else if(S.room.phase==="scoring") html=viewScoring();
  else html=viewResults();

  const sig=S.screen+"|"+(S.room?S.room.phase+"|"+S.room.mode+"|"+S.room.order+"|"+(!!S.room.trim)+"|"+(!!S.room.gradesRevealed)+"|"+myCursor()+"|"+S.room.targets.length+"|"+S.room.criteria.length+"|"+S.room.maxTotal:"")+"|"+S.err+"|"+S.banner+"|"+(S.modal?"m":"");
  if(!force&&sig===S.lastSig&&S.room&&S.screen==="room"){ refreshLive(); return; }
  S.lastSig=sig;
  APP.innerHTML=(S.modal?modalHTML():"")+html;
  HDR.textContent=S.code?("방 "+S.code+" · "+(S.name||"이름없음")+(isHost()?" (방장)":"")):"";
  bind();
}

function liveHTML(){
  if(!S.room) return "";
  const on=onlineIds(), T=S.room.targets.length, cur=S.room.cursor||0;
  let h='<div class="row tight">';
  memberList().forEach(m=>{
    if(!m.ownerId && !scoresOf()[m.id]) return;
    let cls="chip", label=m.name||"이름없음";
    if(S.room.phase==="scoring"){
      if(S.room.mode==="sync"){ const d=isDone(m.id,cur); cls+=d?" done":" wait"; label+=d?" 제출완료":" 입력중"; }
      else { const dc=doneCount(m.id); cls+=dc>=T?" done":" wait"; label+=" "+dc+"/"+T; }
    }
    if(!m.ownerId) label+=" (미접속)";
    h+='<span class="'+cls+'"><i class="dot'+(on.has(m.id)?" on":"")+'"></i>'+esc(label)+(m.id===S.room.hostMemberId?" 👑":"")+'</span>';
  });
  return h+'</div>';
}

/* ───────── 등급 발표 연출 ─────────
   #app 바깥(document.body)에 직접 오버레이를 붙여서, 앱의 일반 재렌더링(APP.innerHTML 교체)과
   무관하게 애니메이션이 끊기지 않고 끝까지 재생되도록 한다. */
const sleep=ms=>new Promise(res=>setTimeout(res,ms));
function spawnConfetti(container){
  const colors=["#ff5ea8","#ffb347","#fff066","#6bffb8","#5ec8ff","#a26bff"];
  for(let i=0;i<36;i++){
    const p=document.createElement("div");
    p.className="confetti";
    p.style.left=(Math.random()*100)+"%";
    p.style.background=colors[Math.floor(Math.random()*colors.length)];
    p.style.animationDelay=(Math.random()*0.4)+"s";
    container.appendChild(p);
    setTimeout(()=>{ try{p.remove();}catch(e){} },2200);
  }
}

   화면 가로세로 비율에 맞춰 행/열 수를 계산해, 카드 크기가 자동으로 줄어들며 전부 한 화면 안에 들어오게 한다. */
/* g(computeGrades/buildGrades 결과)를 '개별 대상' 카드 목록으로 펼친다.
   순서: 송급→완급→박급→배급→범급→도급→양급, 각 등급 안에서는 낮은 점수→높은 점수. */
function buildRevealList(g){
  const order=[
    {tier:"song", name:"송급"}, {tier:"wan", name:"완급"}, {tier:"bak", name:"박급"},
    {tier:"bae", name:"배급"}, {tier:"beom", name:"범급"}, {tier:"do", name:"도급"}
  ];
  const list=[];
  order.forEach(t=>{
    const grp=g.groups.find(x=>x.name===t.name);
    (grp?grp.members:[]).slice().sort((a,b)=>a.total-b.total).forEach(m=>{
      list.push({ tier:t.tier, gradeName:t.name, name:m.name, total:m.total, per:m.per });
    });
  });
  g.special.members.slice().sort((a,b)=>a.total-b.total).forEach(m=>{
    list.push({ tier:"yang", gradeName:"양급", name:m.name, total:m.total, per:m.per, special:true });
  });
  return list;
}
const MANUAL_TIERS=new Set(["beom","do","yang"]);
/* 방 공용(Firebase) gradeAdvance 값이 baseline보다 커질 때까지, 또는 gradeSkipAll이 켜질 때까지 기다린다.
   방장이 '다음 카드 공개'를 누르면 gradeAdvance가 하나 올라가고, 모든 참가자의 대기가 동시에 풀린다. */
function waitForFirebaseAdvance(){
  return new Promise(resolve=>{
    let baseline=null;
    const path=R(Proom(S.code));
    const unsub=onValue(path, snap=>{
      const v=snap.val()||{};
      if(v.gradeSkipAll){ try{unsub();}catch(e){} resolve(); return; }
      const adv=v.gradeAdvance||0;
      if(baseline===null){ baseline=adv; return; }
      if(adv>baseline){ try{unsub();}catch(e){} resolve(); }
    });
  });
}
async function bumpGradeAdvance(){
  try{
    const snap=await get(R(Proom(S.code)+"/gradeAdvance"));
    const cur=snap.exists()?snap.val():0;
    await update(R(Proom(S.code)),{gradeAdvance:cur+1});
  }catch(e){}
}
/* 로컬(테스트) 모드: 참가자가 나 혼자이므로 버튼만 누르면 바로 풀린다 */
function waitForLocalAdvance(container, label){
  return new Promise(resolve=>{
    const wrapEl=document.createElement("div");
    wrapEl.className="gradeManualWait";
    const btn=document.createElement("button");
    btn.className="primary gradeNextBtn";
    btn.textContent=label||"다음 카드 공개";
    btn.addEventListener("click",()=>{ try{wrapEl.remove();}catch(e){} resolve(); });
    wrapEl.appendChild(btn);
    container.appendChild(wrapEl);
  });
}
/* 방장이 버튼을 눌러야 다음으로 넘어가는 '관문'. sync=true면 Firebase로 전원에게 동시에 풀리고,
   sync=false(테스트 모드)면 로컬에서 본인이 누르면 바로 풀린다. */
async function manualGate(ov, sync, btnLabel, waitMsg){
  if(!sync){
    await waitForLocalAdvance(ov, btnLabel);
    return;
  }
  const waitEl=document.createElement("div");
  waitEl.className="gradeManualWait";
  if(isHost()){
    const btn=document.createElement("button");
    btn.className="primary gradeNextBtn";
    btn.textContent=btnLabel;
    btn.addEventListener("click",()=>{ btn.disabled=true; btn.textContent="공개 중…"; bumpGradeAdvance(); });
    waitEl.appendChild(btn);
  }else{
    waitEl.innerHTML="<p class='gradeWaitMsg'>"+esc(waitMsg)+"</p>";
  }
  ov.appendChild(waitEl);
  await waitForFirebaseAdvance();
  try{waitEl.remove();}catch(e){}
}
const BULK_TIERS=["song","wan","bak","bae"]; /* 범급 미만 */
async function playGradeReveal(g, opts){
  opts=opts||{};
  const sync=!!opts.sync;
  const bulkLow=!!opts.bulkLowTiers;
  const fullList=buildRevealList(g);
  const bulkMembers = bulkLow ? fullList.filter(x=>BULK_TIERS.includes(x.tier)) : [];
  const indivList = bulkLow ? fullList.filter(x=>!BULK_TIERS.includes(x.tier)) : fullList;
  const totalCount=fullList.length;

  const ov=document.createElement("div");
  ov.className="gradeOverlay";

  let skipped=false;
  let skipEnabled=true;
  const topControls=document.createElement("div");
  topControls.className="gradeTopControls";
  const skipToggle=document.createElement("button");
  skipToggle.className="sm ghost";
  const skip=document.createElement("button");
  skip.className="sm ghost";
  skip.textContent="넘기기";
  function renderSkipToggleLabel(){ skipToggle.textContent=skipEnabled?"넘기기 끄기":"넘기기 켜기"; }
  function applySkipVisibility(){ skip.style.display=skipEnabled?"":"none"; }
  renderSkipToggleLabel(); applySkipVisibility();
  skip.addEventListener("click",async ()=>{
    skipped=true;
    if(sync && isHost()){ try{ await update(R(Proom(S.code)),{gradeSkipAll:true}); }catch(e){} }
  });
  let toggleUnsub=null;
  if(sync){
    if(isHost()){
      skipToggle.addEventListener("click",async ()=>{
        skipEnabled=!skipEnabled; renderSkipToggleLabel(); applySkipVisibility();
        const patch={gradeSkipEnabled:skipEnabled};
        if(!skipEnabled) patch.gradeSkipAll=false; /* 끌 때는 이미 걸려있던 '전체 넘기기' 신호도 함께 해제 */
        try{ await update(R(Proom(S.code)),patch); }catch(e){}
      });
    }else{
      skipToggle.style.display="none";
    }
    toggleUnsub=onValue(R(Proom(S.code)+"/gradeSkipEnabled"), snap=>{
      const v=snap.val();
      const wasEnabled=skipEnabled;
      skipEnabled=(v===undefined)?true:!!v;
      if(wasEnabled && !skipEnabled) skipped=false; /* 꺼지는 순간 내 넘기기 상태도 함께 해제 */
      renderSkipToggleLabel(); applySkipVisibility();
    });
  }else{
    skipToggle.addEventListener("click",()=>{
      const turningOff=skipEnabled;
      skipEnabled=!skipEnabled;
      if(turningOff) skipped=false;
      renderSkipToggleLabel(); applySkipVisibility();
    });
  }
  topControls.appendChild(skipToggle); topControls.appendChild(skip);

  const title=document.createElement("div");
  title.className="gradeStage-title";
  title.innerHTML="<h2>🏆 등급 발표</h2>";
  const progress=document.createElement("div");
  progress.className="gradeProgress";
  const progressBar=document.createElement("div");
  progressBar.className="gradeProgressBar";
  progressBar.style.width="0%";
  progress.appendChild(progressBar);
  const count=document.createElement("div");
  count.className="gradeCount";
  const stage=document.createElement("div");
  stage.className="gradeStage single";
  ov.appendChild(topControls); ov.appendChild(title); ov.appendChild(progress); ov.appendChild(count); ov.appendChild(stage);
  document.body.appendChild(ov);

  if(!totalCount){
    count.textContent="등급을 매길 수 있는 대상이 없습니다.";
  }

  let shown=0;

  /* 1단계(선택): 범급 미만 등급을 격자로 모아, 좌상단부터 하나씩 쫙 펼쳐 한 번에 보여준다 */
  if(bulkMembers.length){
    const grid=document.createElement("div");
    grid.className="gradeGrid";
    const ratio=(window.innerWidth||1)/(window.innerHeight||1);
    const n=bulkMembers.length;
    const cols=Math.max(1, Math.round(Math.sqrt(n*ratio)));
    const rows=Math.max(1, Math.ceil(n/cols));
    grid.style.gridTemplateColumns="repeat("+cols+",1fr)";
    grid.style.gridTemplateRows="repeat("+rows+",1fr)";
    stage.style.display="none";
    ov.insertBefore(grid, stage);
    count.textContent="범급 미만 등급 한번에 공개 · "+n+"명";

    const sortedBulk=bulkMembers.slice().sort((a,b)=>b.total-a.total);
    const stagger=skipped?6:35;
    sortedBulk.forEach((m,idx)=>{
      const c=document.createElement("div");
      c.className="gradeGridCard tier-"+m.tier;
      c.style.animationDelay=(idx*stagger)+"ms";
      c.innerHTML="<div class='ggname'>"+esc(m.name)+"</div><div class='ggscore'>"+num(m.total,2)+"점</div>";
      grid.appendChild(c);
    });
    const cascadeMs=sortedBulk.length*stagger+400;
    await sleep(skipped ? Math.min(cascadeMs,400) : cascadeMs);
    shown+=bulkMembers.length;
    progressBar.style.width=Math.round(shown/totalCount*100)+"%";

    if(!skipped){
      await manualGate(ov, sync, "계속하기", "방장이 계속하기를 누르면 이어집니다…");
    }else{
      await sleep(150);
    }
    try{grid.remove();}catch(e){}
    stage.style.display="";
  }

  /* 2단계: 나머지 등급(범급 이상, 혹은 일괄공개를 안 썼다면 전체)을 기존처럼 한 장씩 */
  let current=null;
  for(let i=0;i<indivList.length;i++){
    const item=indivList[i];
    /* 이전 카드를 먼저 살짝 사라지게 한 뒤, 새 카드를 그 자리에 교체해서 넣는다(한 장씩만 보임) */
    if(current){
      current.classList.add("leaving");
      await sleep(560);
      try{current.remove();}catch(e){}
    }
    const wrap=document.createElement("div");
    wrap.className="gradeCardWrap";
    const inner=document.createElement("div");
    inner.className="gradeCardInner";
    const back=document.createElement("div");
    back.className="gradeFace back";
    back.innerHTML="<div class='backmark'>?</div>";
    const front=document.createElement("div");
    front.className="gradeFace front tier-"+item.tier;
    let perHTML="";
    if(item.per && g.criteria && g.criteria.length){
      perHTML="<div class='gperlist'>"+g.criteria.map((c,ci)=>{
        const p=item.per[ci];
        const val=(p && p.pts!==null && p.pts!==undefined) ? num(p.pts,2) : "–";
        return "<div class='gperitem'><span class='gpn'>"+esc(c.name)+"</span><span class='gpv'>"+val+"</span></div>";
      }).join("")+"</div>";
    }
    front.innerHTML="<div class='gbadge'>"+(item.special?"✨ ":"")+esc(item.gradeName)+"</div>"+
      "<h3>"+esc(item.name)+"</h3>"+
      "<div class='gcut'>"+num(item.total,2)+"점</div>"+perHTML;
    inner.appendChild(back); inner.appendChild(front);
    wrap.appendChild(inner);
    stage.appendChild(wrap);
    current=wrap;
    shown++;
    count.textContent=shown+" / "+totalCount+" · "+esc(item.gradeName);
    progressBar.style.width=Math.round(shown/totalCount*100)+"%";

    /* 뒷면 단계: 범급 이상은 방장이 눌러야 앞면이 공개되고, 그 외 등급은 잠깐 뒤 자동으로 뒤집힌다 */
    if(MANUAL_TIERS.has(item.tier) && !skipped){
      await manualGate(ov, sync, "카드 공개", "방장이 카드를 공개하면 보입니다…");
    }else{
      await sleep(skipped ? 160 : 520);
    }
    inner.classList.add("flipped");
    if(item.special) spawnConfetti(ov);

    /* 앞면 공개 후: 모든 등급이 방장 클릭으로만 다음 카드로 넘어간다 */
    if(!skipped){
      await manualGate(ov, sync, "다음 카드 공개", "방장이 다음 카드를 공개하면 이어집니다…");
    }else{
      await sleep(220);
    }
  }

  const closeBtn=document.createElement("button");
  closeBtn.className="primary gradeClose";
  closeBtn.textContent="닫기";
  closeBtn.addEventListener("click",()=>{
    if(toggleUnsub){ try{toggleUnsub();}catch(e){} }
    try{ov.remove();}catch(e){}
  });
  ov.appendChild(closeBtn);
}

    });
  });

  const rf=$("#resumeFile");
  if(rf) rf.addEventListener("change",async e=>{
    const f=e.target.files&&e.target.files[0]; if(!f) return;
    try{
      const d=JSON.parse(await readFile(f));
      if(!d||!Array.isArray(d.targets)) throw new Error("형식이 올바르지 않습니다.");
      if(!S.name){ S.err="먼저 이름을 입력하세요."; return render(true); }
      S.err=""; S.banner="이어하기 데이터를 불러왔습니다.";
      await createRoom(d);
    }catch(err){ S.err="이어하기 파일을 읽을 수 없습니다: "+err.message; render(true); }
  });
  const ft=$("#fTargets");
  if(ft) ft.addEventListener("change",async e=>{
    const f=e.target.files&&e.target.files[0]; if(!f) return;
    try{
      const list=parseTargets(await readFile(f));
      if(!list.length) throw new Error("대상이 비어 있습니다.");
      S.err=""; await update(R(Proom(S.code)),{targets:list});
    }catch(err){ S.err=err.message; render(true); }
  });
  const fc=$("#fCrits");
  if(fc) fc.addEventListener("change",async e=>{
    const f=e.target.files&&e.target.files[0]; if(!f) return;
    try{
      const parsed=parseCriteria(await readFile(f));
      S.err=""; await update(R(Proom(S.code)),{criteria:parsed.criteria,maxTotal:parsed.maxTotal});
    }catch(err){ S.err=err.message; render(true); }
  });
  const fcb=$("#fCombined");
  if(fcb) fcb.addEventListener("change",async e=>{
    const f=e.target.files&&e.target.files[0]; if(!f) return;
    try{
      const parsed=parseCombined(await readFile(f));
      S.err="";
      await update(R(Proom(S.code)),{targets:parsed.targets, criteria:parsed.criteria, maxTotal:parsed.maxTotal});
    }catch(err){ S.err=err.message; render(true); }
  });
  const frs=$("#fResumeSetup");
  if(frs) frs.addEventListener("change",async e=>{
    const f=e.target.files&&e.target.files[0]; if(!f) return;
    try{
      const d=JSON.parse(await readFile(f));
      if(!d||!Array.isArray(d.targets)||!Array.isArray(d.criteria)) throw new Error("형식이 올바르지 않습니다.");
      S.err="";
      await update(R(Proom(S.code)),{
        targets:d.targets, criteria:d.criteria, maxTotal:d.maxTotal||S.room.maxTotal,
        order:d.order||S.room.order||"seq", trim:d.trim!==undefined?!!d.trim:!!S.room.trim,
        cursor:d.cursor||0, maxReached:d.maxReached||0, resumed:true
      });
      const merge={};
      (d.members||[]).forEach(m=>{
        if(m&&m.id&&!members()[m.id]) merge["members/"+m.id]={name:m.name||"이전 멤버",ownerId:null,cursor:m.cursor||0,joinedAt:Date.now()};
      });
      Object.keys(d.scores||{}).forEach(id=>{ const s=d.scores[id];
        merge["scores/"+id]={name:s.name||"이전 멤버",v:obj(s.v),done:obj(s.done)}; });
      if(Object.keys(merge).length) await update(R(Proom(S.code)),merge);
      S.banner="이어하기 데이터를 불러왔습니다. 이미 채점된 항목은 그대로 유지된 채 이어서 진행할 수 있습니다.";
      render(true);
    }catch(err){ S.err="이어하기 파일을 읽을 수 없습니다: "+err.message; render(true); }
  });

  const fst=$("#fSingleTargets");
  if(fst) fst.addEventListener("change",async e=>{
    const f=e.target.files&&e.target.files[0]; if(!f) return;
    try{
      const list=parseTargets(await readFile(f));
      if(!list.length) throw new Error("대상이 비어 있습니다.");
      S.err=""; S.single.targets=list; render(true);
    }catch(err){ S.err=err.message; render(true); }
  });
  const fsc=$("#fSingleCriteria");
  if(fsc) fsc.addEventListener("change",async e=>{
    const f=e.target.files&&e.target.files[0]; if(!f) return;
    try{
      const parsed=parseCriteria(await readFile(f));
      S.err=""; S.single.criteria=parsed.criteria; S.single.maxTotal=parsed.maxTotal; render(true);
    }catch(err){ S.err=err.message; render(true); }
  });
  const fscb=$("#fSingleCombined");
  if(fscb) fscb.addEventListener("change",async e=>{
    const f=e.target.files&&e.target.files[0]; if(!f) return;
    try{
      const parsed=parseCombined(await readFile(f));
      S.err=""; S.single.targets=parsed.targets; S.single.criteria=parsed.criteria; S.single.maxTotal=parsed.maxTotal; render(true);
    }catch(err){ S.err=err.message; render(true); }
  });
  const fsr=$("#fSingleResume");
  if(fsr) fsr.addEventListener("change",async e=>{
    const f=e.target.files&&e.target.files[0]; if(!f) return;
    try{
      const d=JSON.parse(await readFile(f));
      if(!d||!Array.isArray(d.targets)||!Array.isArray(d.criteria)) throw new Error("형식이 올바르지 않습니다.");
      S.single.targets=d.targets; S.single.criteria=d.criteria; S.single.maxTotal=d.maxTotal||100;
      S.single.v=obj(d.v); S.single.done=obj(d.done);
      if(d.name){ S.name=d.name; ls("sc.name",S.name); }
      S.err=""; S.banner="이전 채점 내용을 불러왔습니다.";
      render(true);
    }catch(err){ S.err="파일을 읽을 수 없습니다: "+err.message; render(true); }
  });
  const fcol=$("#fSingleCollect");
  if(fcol) fcol.addEventListener("change",async e=>{
    const files=Array.from(e.target.files||[]);
    if(!files.length) return;
    try{
      for(const f of files){
        const d=JSON.parse(await readFile(f));
        if(!d||!Array.isArray(d.targets)||!Array.isArray(d.criteria)||!d.v) throw new Error(f.name+": 형식이 올바르지 않습니다.");
        S.single.collected.push({
          id:"u"+S.single.collected.length+"_"+Date.now()+"_"+Math.random().toString(36).slice(2,6),
          name:d.name||f.name.replace(/\.[^.]+$/,""),
          targets:d.targets, criteria:d.criteria, maxTotal:d.maxTotal,
          v:obj(d.v), done:obj(d.done)
        });
      }
      S.err="";
    }catch(err){ S.err="파일을 읽을 수 없습니다: "+err.message; }
    e.target.value="";
    render(true);
  });
}

async function handle(act,d){
  S.err="";
  try{
    if(act==="create"){ if(!S.name){S.err="이름을 입력하세요.";return render(true);} S.banner=""; await createRoom(null); }
    else if(act==="join"){ if(!S.name){S.err="이름을 입력하세요.";return render(true);} await enterRoom(($("#joincode")||{}).value); }
    else if(act==="claim"){ if(!S.name){S.err="이름을 입력하세요.";return render(true);} await claimSlot(S.pending.code,d.mid); }
    else if(act==="joinnew"){ if(!S.name){S.err="이름을 입력하세요.";return render(true);} await joinAsNew(S.pending.code); }
    else if(act==="home"){ S.pending=null; S.screen="lobby"; render(true); }
    else if(act==="leave"){ await leaveRoom(); }
    else if(act==="mode"){ await update(R(Proom(S.code)),{mode:d.mode}); }
    else if(act==="order"){ await update(R(Proom(S.code)),{order:d.order}); }
    else if(act==="trim"){ await update(R(Proom(S.code)),{trim:d.trim==="1"}); }
    else if(act==="kick"){ if(!isHost()){S.err="방장만 사용할 수 있습니다.";return render(true);} await kickMember(d.mid); }
    else if(act==="start"){
      const targets = S.room.order==="random" ? shuffleArr(S.room.targets) : S.room.targets;
      await update(R(Proom(S.code)),{phase:"scoring", targets});
      S.draftFor=null; S.banner="";
    }
    else if(act==="skip"){ S.skip[d.ci]=!S.skip[d.ci]; if(S.skip[d.ci]){ S.draft[d.ci]=""; delete S.draftVal[d.ci]; } render(true); }
    else if(act==="skipall"){ S.room.criteria.forEach((c,ci)=>{S.skip[ci]=true; delete S.draftVal[ci];}); render(true); }
    else if(act==="submit"){ S.banner=""; await submitTarget(); }
    else if(act==="prev"){ await moveCursor(-1); }
    else if(act==="skiptarget"){ if(!isHost()){S.err="방장만 사용할 수 있습니다.";return render(true);} await moveCursor(1); }
    else if(act==="next"){ await moveCursor(1); }
    else if(act==="forceresult"){ await update(R(Proom(S.code)),{phase:"results"}); }
    else if(act==="revealgrades"){
      if(!isHost()){S.err="방장만 사용할 수 있습니다.";return render(true);}
      const bulkLow=!!(($("#bulkLowToggle")||{}).checked);
      await update(R(Proom(S.code)),{gradesRevealed:true, gradeAdvance:0, gradeSkipAll:false, gradeSkipEnabled:true, gradeBulkLowTiers:bulkLow});
    }
    else if(act==="testgrades"){
      const cbId=d.testcb||"testBulkToggle";
      const bulkLow=!!(($("#"+cbId)||{}).checked);
      playGradeReveal(buildGrades(genTestRows(100)), {bulkLowTiers:bulkLow});
    }
    else if(act==="backscore"){ await update(R(Proom(S.code)),{phase:"scoring"}); S.draftFor=null; }
    else if(act==="detail"){ S.modal={ti:Number(d.ti)}; render(true); }
    else if(act==="sortresult"){
      const key=d.key;
      if(!S.resultSort||S.resultSort.key!==key) S.resultSort={key,dir:"desc"};
      else if(S.resultSort.dir==="desc") S.resultSort={key,dir:"asc"};
      else S.resultSort={key:null,dir:"desc"};
      render(true);
    }
    else if(act==="closemodal"){ S.modal=null; render(true); }
    else if(act==="savejson") download("scoring-"+S.code+".json",JSON.stringify(buildSession(),null,2));
    else if(act==="savetxt")  download("scoring-"+S.code+".txt", JSON.stringify(buildSession(),null,2));
    else if(act==="dl1"){
      const rows=aggregate();
      download("결과_총점.txt", rows.map(r=>r.name+" : "+(r.total===null?"-":num(r.total,2))).join("\n")+"\n");
    }
    else if(act==="dl2"){
      const rows=aggregate(), crits=S.room.criteria;
      const head="# 만점 "+S.room.maxTotal+"점 · 항목 순서: "+crits.map(c=>c.name+"("+c.max+"점)").join(" / ")+" / 총점\n";
      download("결과_항목별.txt", head+rows.map(r=>r.name+" : "+r.per.map(p=>p.pts===null?"-":num(p.pts,2)).join(" / ")+" / "+(r.total===null?"-":num(r.total,2))).join("\n")+"\n");
    }
    else if(act==="curdl1"){
      if(!isHost()){S.err="방장만 다운로드할 수 있습니다.";return render(true);}
      const rows=aggregate();
      download("진행중_총점_"+S.code+".txt", rows.map(r=>r.name+" : "+(r.total===null?"-":num(r.total,2))).join("\n")+"\n");
    }
    else if(act==="curdl2"){
      if(!isHost()){S.err="방장만 다운로드할 수 있습니다.";return render(true);}
      const rows=aggregate(), crits=S.room.criteria;
      const head="# ("+new Date().toLocaleString()+" 기준, 진행 중) 만점 "+S.room.maxTotal+"점 · 항목 순서: "+crits.map(c=>c.name+"("+c.max+"점)").join(" / ")+" / 총점\n";
      download("진행중_항목별_"+S.code+".txt", head+rows.map(r=>r.name+" : "+r.per.map(p=>p.pts===null?"-":num(p.pts,2)).join(" / ")+" / "+(r.total===null?"-":num(r.total,2))).join("\n")+"\n");
    }
    else if(act==="singlestart"){
      S.screen="singlesetup";
      S.single={ targets:[], criteria:[], maxTotal:100, cursor:0, v:{}, done:{}, draft:{}, draftVal:{}, draftFor:null, skip:{}, collected:[] };
      S.err=""; render(true);
    }
    else if(act==="singlecollect"){
      S.screen="singlecollect";
      S.single={ targets:[], criteria:[], maxTotal:100, cursor:0, v:{}, done:{}, draft:{}, draftVal:{}, draftFor:null, skip:{}, collected:[] };
      S.err=""; render(true);
    }
    else if(act==="singlehome"){ S.screen="lobby"; S.single=null; S.err=""; S.banner=""; render(true); }
    else if(act==="singlego"){
      if(!S.name){ S.err="이름을 입력하세요."; return render(true); }
      if(!S.single.targets.length||!S.single.criteria.length){ S.err="대상과 항목 파일을 모두 불러오세요."; return render(true); }
      S.single.cursor=singleFirstUndone(); S.single.draftFor=null; S.screen="singlescore"; S.err=""; render(true);
    }
    else if(act==="singlesubmit"){ singleSubmit(); }
    else if(act==="singleprev"){ singleMove(-1); }
    else if(act==="singlenext"){ singleMove(1); }
    else if(act==="singleskip"){ S.single.skip[d.ci]=!S.single.skip[d.ci]; if(S.single.skip[d.ci]){ S.single.draft[d.ci]=""; delete S.single.draftVal[d.ci]; } render(true); }
    else if(act==="singleskipall"){ S.single.criteria.forEach((c,ci)=>{S.single.skip[ci]=true; delete S.single.draftVal[ci];}); render(true); }
    else if(act==="singleexport"){
      const nm=(S.name||"이름없음").replace(/[\\/:*?"<>|]/g,"_");
      download("개인결과_"+nm+".json", JSON.stringify(buildSingleExport(),null,2));
    }
    else if(act==="singleremove"){ S.single.collected.splice(Number(d.idx),1); render(true); }
    else if(act==="singlereset"){ S.single.collected=[]; render(true); }
    else if(act==="singledl1"){
      const combo=singleCombined(); if(!combo) return;
      download("취합결과_총점.txt", combo.rows.map(r=>r.name+" : "+(r.total===null?"-":num(r.total,2))).join("\n")+"\n");
    }
    else if(act==="singledl2"){
      const combo=singleCombined(); if(!combo) return;
      const head="# 만점 "+combo.maxTotal+"점 · 항목 순서: "+combo.criteria.map(c=>c.name+"("+c.max+"점)").join(" / ")+" / 총점\n";
      download("취합결과_항목별.txt", head+combo.rows.map(r=>r.name+" : "+r.per.map(p=>p.pts===null?"-":num(p.pts,2)).join(" / ")+" / "+(r.total===null?"-":num(r.total,2))).join("\n")+"\n");
    }
  }catch(e){ S.err="오류: "+((e&&e.message)||"알 수 없음"); render(true); }
}

window.addEventListener("beforeunload",()=>{ try{ if(S.code) remove(R(Proom(S.code)+"/presence/"+S.peerId)); }catch(e){} });
</script>
</body>
